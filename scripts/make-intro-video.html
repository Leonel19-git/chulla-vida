<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CHULLA VIDA · animación del video de intro</title>
<!--
  Animación original del video de intro de CHULLA VIDA (canvas 1280×720).

  Cómo se usa
  - Vista previa: con el servidor de Vite encendido, abre /scripts/make-intro-video.html.
    Añade ?clean=1 para ver la versión sin textos (fondo del hero de la portada).
  - Grabación: `node scripts/make-intro-video.mjs` abre esta página con Playwright, pide
    cada fotograma con window.cvRenderFrame(t) y los codifica con el ffmpeg que trae Playwright.
    Ver el procedimiento completo en make-intro-video.mjs.

  Material: solo fotos reales del catálogo (public/images/places/*-1280.webp) con licencia
  libre; autores y licencias en public/images/CREDITS.md y public/video/CREDITS.md.
  El video es una obra derivada: las fotos CC BY-SA se comparten bajo la misma licencia.
-->
<style>
  html, body { margin: 0; background: #012960; }
  canvas { display: block; width: 100vw; height: auto; max-width: 1280px; margin: 0 auto; }
  body.recording canvas { width: 1280px; max-width: none; }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720" aria-label="Video de intro de CHULLA VIDA"></canvas>
<script type="module">
const W = 1280, H = 720;
const clean = new URLSearchParams(location.search).has('clean');
const recording = new URLSearchParams(location.search).has('record');
if (recording) document.body.classList.add('recording');

/* Escenas: lugar, provincia y región tal como están en el catálogo. */
const SCENES = [
  { file: 'gen-02-quilotoa-shalala', place: 'Laguna del Quilotoa', where: 'Cotopaxi', region: 'Sierra', color: '#c2552e', from: [0.5, 0.62], to: [0.46, 0.56] },
  { file: 'costa-07-ola-y-manglar', place: 'Mompiche', where: 'Esmeraldas', region: 'Costa', color: '#0a8aa6', from: [0.5, 0.45], to: [0.55, 0.5] },
  { file: 'amz-01-reserva-cuyabeno', place: 'Laguna Grande de Cuyabeno', where: 'Sucumbíos', region: 'Amazonía', color: '#1f8a52', from: [0.62, 0.5], to: [0.54, 0.52] },
  { file: 'gal-04-kicker-rock-tour-360', place: 'León Dormido · Kicker Rock', where: 'San Cristóbal', region: 'Galápagos', color: '#3a63b8', from: [0.7, 0.42], to: [0.62, 0.46] },
  { file: 'gen-09-parque-nacional-cotopaxi', place: 'Volcán Cotopaxi', where: 'Cotopaxi', region: 'Sierra', color: '#c2552e', from: [0.42, 0.4], to: [0.48, 0.48] },
  { file: 'gen-07-banos-de-agua-santa', place: 'Pailón del Diablo, Baños', where: 'Tungurahua', region: 'Sierra', color: '#c2552e', from: [0.55, 0.62], to: [0.5, 0.5] },
  { file: 'gen-10-otavalo', place: 'Plaza de los Ponchos, Otavalo', where: 'Imbabura', region: 'Sierra', color: '#c2552e', from: [0.4, 0.5], to: [0.5, 0.45] },
];
const SCENE = 2.0;           // segundos por foto
const FADE = 0.4;            // fundido entre fotos
const OUTRO = clean ? 0 : 2.9; // cierre con logo y lema
const DURATION = SCENES.length * SCENE + OUTRO + (clean ? FADE : 0);
window.cvDuration = DURATION;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const load = src => new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = src; });
const ease = t => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

async function fonts() {
  const faces = [
    new FontFace('CV Serif', "url('/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2')", { weight: '200 800' }),
    new FontFace('CV Sans', "url('/node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2')", { weight: '200 800' }),
  ];
  for (const face of faces) { try { document.fonts.add(await face.load()); } catch { /* sin fuente: se usa la del sistema */ } }
}

const ready = (async () => {
  await fonts();
  const images = await Promise.all(SCENES.map(scene => load(`/images/places/${scene.file}-1280.webp`)));
  const logo = await load('/brand/logo-1024.webp');
  return { images, logo };
})();

/* Ken Burns: escala 1,04 → 1,16 y desplazamiento suave del foco. */
function drawPhoto(img, scene, p, alpha) {
  const scale = 1.04 + 0.12 * p;
  const cover = Math.max(W / img.width, H / img.height) * scale;
  const dw = img.width * cover, dh = img.height * cover;
  const fx = scene.from[0] + (scene.to[0] - scene.from[0]) * p;
  const fy = scene.from[1] + (scene.to[1] - scene.from[1]) * p;
  const x = clamp(W / 2 - dw * fx, W - dw, 0), y = clamp(H / 2 - dh * fy, H - dh, 0);
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, x, y, dw, dh);
  ctx.globalAlpha = 1;
}

function shade() {
  const g = ctx.createLinearGradient(0, H * 0.35, 0, H);
  g.addColorStop(0, 'rgba(1,20,48,0)');
  g.addColorStop(1, 'rgba(1,20,48,0.78)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const side = ctx.createLinearGradient(0, 0, W * 0.55, 0);
  side.addColorStop(0, 'rgba(1,20,48,0.45)'); side.addColorStop(1, 'rgba(1,20,48,0)');
  ctx.fillStyle = side; ctx.fillRect(0, 0, W, H);
}

/* Banda textil propia (rombos y escalones simples), igual que en la web. */
function textile(y, h, offset) {
  ctx.save();
  ctx.fillStyle = '#012960'; ctx.fillRect(0, y, W, h);
  const step = h * 4;
  for (let x = -step + (offset % step); x < W + step; x += step) {
    ctx.fillStyle = '#fed65a'; diamond(x + step * 0.25, y + h / 2, h * 0.42);
    ctx.fillStyle = '#c61534'; diamond(x + step * 0.75, y + h / 2, h * 0.42);
    ctx.fillStyle = '#4cc69f'; ctx.fillRect(x + step * 0.45, y + h / 2 - 1.5, step * 0.1, 3);
  }
  ctx.restore();
}
function diamond(cx, cy, r) { ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy); ctx.closePath(); ctx.fill(); }

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function caption(scene, local, index) {
  const inT = ease((local - 0.15) / 0.45);
  // Sale antes de que empiece a entrar la foto siguiente: el nombre nunca queda sobre otro lugar.
  const outT = ease((local - (SCENE - FADE - 0.2)) / 0.2);
  const a = inT * (1 - outT);
  if (a <= 0) return;
  const dx = (1 - inT) * -28;
  ctx.save();
  ctx.globalAlpha = a;
  // Chip de región con su color
  ctx.font = '700 22px "CV Sans", system-ui, sans-serif';
  const label = `${scene.region} · ${scene.where}`;
  const lw = ctx.measureText(label).width + 44;
  roundRect(72 + dx, 470, lw, 44, 22); ctx.fillStyle = scene.color; ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'middle'; ctx.fillText(label, 94 + dx, 493);
  // Nombre del lugar
  ctx.font = '600 72px "CV Serif", Georgia, serif';
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#fffaf0';
  ctx.fillText(scene.place, 68 + dx * 1.4, 600);
  ctx.shadowBlur = 0;
  // Contador de escenas: una raya por foto
  for (let i = 0; i < SCENES.length; i++) {
    ctx.fillStyle = i === index ? '#fed65a' : 'rgba(255,255,255,0.45)';
    roundRect(72 + i * 34, 640, i === index ? 26 : 22, 6, 3); ctx.fill();
  }
  ctx.restore();
}

function outro(t, logo) {
  // t: segundos desde el inicio del cierre
  const bg = ease(t / 0.5);
  ctx.save();
  ctx.globalAlpha = bg;
  const g = ctx.createRadialGradient(W / 2, H * 0.42, 40, W / 2, H / 2, W * 0.75);
  g.addColorStop(0, '#0b3c7d'); g.addColorStop(1, '#011a40');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  textile(H - 22, 22, t * 60);
  const pop = ease((t - 0.25) / 0.7);
  const s = 0.82 + 0.18 * pop + (pop >= 1 ? Math.sin((t - 0.95) * 2.4) * 0.008 : 0);
  const size = 330 * s;
  ctx.globalAlpha = clamp(pop * 1.4);
  ctx.translate(W / 2, H * 0.4);
  roundRect(-size / 2 - 14, -size / 2 - 14, size + 28, size + 28, 34);
  ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 40; ctx.fill(); ctx.shadowBlur = 0;
  ctx.save(); roundRect(-size / 2, -size / 2, size, size, 24); ctx.clip();
  ctx.drawImage(logo, -size / 2, -size / 2, size, size); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const line = ease((t - 0.85) / 0.6);
  ctx.globalAlpha = line;
  ctx.font = '600 50px "CV Serif", Georgia, serif';
  ctx.textAlign = 'center'; ctx.fillStyle = '#fffaf0';
  ctx.fillText('Descubre el Ecuador que se vive', W / 2, H * 0.4 + 262 + (1 - line) * 16);
  ctx.globalAlpha = ease((t - 1.3) / 0.6);
  ctx.font = '500 17px "CV Sans", system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.78)';
  ctx.fillText('Fotos reales de Wikimedia Commons con licencia libre · créditos en chulla-vida.vercel.app/images/CREDITS.md', W / 2, H - 44);
  ctx.restore();
}

/** Dibuja el fotograma del segundo t. Determinista: el grabador lo llama fotograma a fotograma. */
function renderFrame(t, assets) {
  const { images, logo } = assets;
  ctx.fillStyle = '#012960'; ctx.fillRect(0, 0, W, H);
  const photosEnd = SCENES.length * SCENE;
  for (let i = 0; i < SCENES.length; i++) {
    const start = i * SCENE;
    const local = t - start;
    if (local < -FADE || local > SCENE + FADE) continue;
    // En la versión limpia la última foto funde con la primera para que el bucle no salte.
    const fadeIn = i === 0 && !clean ? 1 : ease((local + FADE) / FADE);
    const p = clamp((local + FADE) / (SCENE + FADE * 2));
    drawPhoto(images[i], SCENES[i], p, fadeIn);
  }
  if (clean && t > photosEnd - FADE) {
    const local = t - photosEnd;
    drawPhoto(images[0], SCENES[0], clamp((local + FADE) / (SCENE + FADE * 2)), ease((local + FADE) / FADE));
  }
  if (!clean) {
    shade();
    const index = Math.min(SCENES.length - 1, Math.floor(t / SCENE));
    if (t < photosEnd + 0.2) caption(SCENES[index], t - index * SCENE, index);
    textile(0, 10, t * 40);
    if (t >= photosEnd) outro(t - photosEnd, logo);
  }
}

window.cvReady = ready.then(() => true);
window.cvRenderFrame = async t => { const assets = await ready; renderFrame(t, assets); return true; };
window.cvFrameJpeg = async (t, quality = 0.92) => { await window.cvRenderFrame(t); return canvas.toDataURL('image/jpeg', quality); };

// Vista previa en vivo (no se usa al grabar)
if (!recording) {
  ready.then(assets => {
    const t0 = performance.now();
    const loop = now => { renderFrame(((now - t0) / 1000) % DURATION, assets); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
